<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - My Drive</title>
    <link rel="icon" type="image/png" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">

    <style>
        :root {
            --term-color: #00ff00;    
            --term-bg: #050505;       
            --panel-bg: #0a0a0a;      
            --alert-color: #ff3333;   
        }

        body {
            background-color: var(--term-bg); color: var(--term-color);
            font-family: 'Courier New', Courier, monospace; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none; transition: filter 0.5s ease, transform 2s ease-in-out, opacity 1s ease, background-color 2s ease, color 2s ease;
        }

        #crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 100;
            transition: background 2s ease;
        }

        #boot-screen { display: flex; flex-direction: column; width: 80vw; height: 80vh; font-size: 18px; z-index: 60; }
        #lock-screen { display: none; flex-direction: column; align-items: center; text-align: center; z-index: 50; }
        #lock-screen h1 { letter-spacing: 5px; text-shadow: 0 0 10px var(--term-color); text-transform: uppercase; }
        #passcode-input {
            background: #111; border: 1px solid var(--term-color); color: var(--term-color);
            padding: 15px; font-size: 20px; text-align: center; letter-spacing: 5px; outline: none; margin-top: 20px; width: 250px; text-transform: lowercase;
        }

        #status-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px 20px; box-sizing: border-box;
            display: none; justify-content: space-between; border-bottom: 1px solid var(--term-color); background: rgba(0,0,0,0.8); z-index: 40;
        }
        .bar-btn { background: none; border: 1px solid var(--term-color); color: var(--term-color); cursor: pointer; margin-left: 5px; font-family: inherit; }
        .bar-btn:hover { background: var(--term-color); color: #000; }

        #main-ui { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; }
        #library-view {
            width: 80vw; max-width: 800px; background: var(--panel-bg); border: 1px solid var(--term-color);
            padding: 20px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.05); text-align: center; position: relative;
        }

        #game-list { margin: 20px 0; max-height: 250px; overflow-y: auto; text-align: left; }
        .folder-header {
            background: #111; border: 1px solid var(--term-color); padding: 10px; margin-top: 10px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .folder-header:hover { background: #222; }
        .folder-content { display: none; padding-left: 20px; border-left: 1px dashed var(--term-color); margin-bottom: 10px; }
        .folder-content.open { display: block; }
        
        .game-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #333; margin-top: 5px; background: #050505; }
        select { background: #111; color: var(--term-color); border: 1px solid var(--term-color); padding: 5px; font-family: inherit; outline: none; }

        /* NOTES UI */
        #notes-container { display: none; margin-top: 15px; text-align: left; border-top: 1px dashed var(--term-color); padding-top: 15px; }
        #notes-area {
            width: 100%; height: 100px; background: #050505; color: var(--term-color); border: 1px solid var(--term-color);
            padding: 10px; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; resize: vertical; outline: none;
        }

        #game-view { display: none; width: 100%; flex-direction: column; align-items: center; }
        #game-wrapper { position: relative; width: 95vw; max-width: 1400px; height: 80vh; background-color: #000; border: 2px solid #333; display: flex; justify-content: center; align-items: center; }
        #game-container, ruffle-player { width: 100%; height: 100%; }

        input[type="file"] { display: none; }
        .custom-btn {
            padding: 10px 20px; font-size: 14px; font-family: inherit; font-weight: bold; background-color: var(--panel-bg);
            color: var(--term-color); border: 1px solid var(--term-color); cursor: pointer; text-transform: uppercase; margin: 5px;
        }
        .custom-btn:hover { background-color: var(--term-color); color: #000; }
        .delete-btn { border-color: var(--alert-color); color: var(--alert-color); }
        .delete-btn:hover { background-color: var(--alert-color); color: #000; }

        @keyframes glitch {
            0%   { transform: translate(0); filter: none; }
            10%  { transform: translate(-3px, 1px); filter: hue-rotate(90deg); }
            20%  { transform: translate(3px, -1px); filter: hue-rotate(180deg); }
            30%  { transform: translate(-2px, 2px); filter: brightness(2); }
            40%  { transform: translate(2px, -2px); filter: invert(1); }
            50%  { transform: translate(-1px, 1px); filter: saturate(5); }
            60%  { transform: translate(1px, -1px); filter: hue-rotate(270deg); }
            70%  { transform: translate(-3px, 0); filter: contrast(3); }
            80%  { transform: translate(3px, 1px); filter: hue-rotate(360deg); }
            90%  { transform: translate(0, -1px); filter: brightness(0.5); }
            100% { transform: translate(0); filter: none; }
        }
        .glitching { animation: glitch 0.15s infinite; }

        @keyframes eyePulse {
            0%, 100% { opacity: 0.12; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.4); }
        }
        #hidden-eye {
            position: absolute; bottom: 8px; right: 12px; font-size: 12px;
            opacity: 0.12; cursor: pointer; user-select: none;
            animation: eyePulse 5s ease-in-out infinite;
            transition: opacity 0.3s;
        }
        #hidden-eye:hover { opacity: 0.9; }

        #mini-terminal { display: none; margin-top: 15px; border-top: 1px dashed var(--term-color); padding-top: 15px; text-align: left; }
        #terminal-output { height: 120px; overflow-y: auto; font-size: 13px; background: #000; border: 1px solid #333; padding: 8px; margin-bottom: 6px; color: #aaa; }
        #terminal-output .t-line { margin: 2px 0; }
        #terminal-output .t-cmd { color: var(--term-color); }
        #terminal-output .t-err { color: var(--alert-color); }
        #terminal-input-row { display: flex; align-items: center; gap: 6px; }
        #terminal-input { flex: 1; background: #000; color: var(--term-color); border: none; border-bottom: 1px solid var(--term-color); font-family: inherit; font-size: 13px; outline: none; padding: 4px; }

        #ctx-menu { display: none; position: fixed; background: #0a0a0a; border: 1px solid var(--term-color); z-index: 9999; min-width: 160px; font-size: 13px; }
        .ctx-item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .ctx-item:last-child { border-bottom: none; }
        .ctx-item:hover { background: var(--term-color); color: #000; }

        /* AI CHAT */
        #ai-chat-panel {
            display: none; position: fixed; bottom: 0; right: 0;
            width: 340px; height: 480px; background: #050505;
            border: 1px solid var(--term-color); border-bottom: none; border-right: none;
            z-index: 500; flex-direction: column;
            box-shadow: -4px -4px 30px rgba(0,255,0,0.08);
        }
        #ai-chat-header {
            padding: 8px 12px; border-bottom: 1px solid var(--term-color);
            font-size: 12px; letter-spacing: 3px; display: flex;
            justify-content: space-between; align-items: center;
            background: #0a0a0a;
        }
        #ai-chat-header span { color: var(--term-color); }
        #ai-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--term-color); display: inline-block; margin-right: 6px; animation: eyePulse 2s ease-in-out infinite; }
        #ai-messages {
            flex: 1; overflow-y: auto; padding: 10px; font-size: 13px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .ai-msg { padding: 7px 10px; border-radius: 2px; max-width: 90%; line-height: 1.5; word-break: break-word; }
        .ai-msg.nexus { background: #0a1a0a; border-left: 2px solid var(--term-color); color: var(--term-color); align-self: flex-start; }
        .ai-msg.user  { background: #111; border-right: 2px solid #555; color: #aaa; align-self: flex-end; text-align: right; }
        .ai-msg.system { color: #444; font-size: 11px; align-self: center; letter-spacing: 1px; }
        .ai-typing { color: #333; font-size: 20px; letter-spacing: 4px; padding: 6px 10px; }
        #ai-input-row { display: flex; border-top: 1px solid var(--term-color); }
        #ai-input {
            flex: 1; background: #000; color: var(--term-color); border: none;
            padding: 10px; font-family: inherit; font-size: 13px; outline: none;
        }
        #ai-send-btn {
            background: none; border: none; border-left: 1px solid var(--term-color);
            color: var(--term-color); padding: 10px 14px; cursor: pointer; font-size: 16px;
        }
        #ai-send-btn:hover { background: var(--term-color); color: #000; }
    </style>
</head>

    <script>
        // --- AUDIO ENGINE (FALLOUT TERMINAL CLACK) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'type') {
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.05);
                gain.gain.setValueAtTime(0.1, now); 
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        let db;
        const dbRequest = indexedDB.open("TerminalGamesDB", 2);
        dbRequest.onupgradeneeded = e => { db = e.target.result; if (!db.objectStoreNames.contains("swfs")) db.createObjectStore("swfs", { keyPath: "name" }); };
        dbRequest.onsuccess = e => db = e.target.result;

        function loadGameLibrary() {
            if (!db) return;
            db.transaction(["swfs"], "readonly").objectStore("swfs").getAll().onsuccess = e => {
                const list = document.getElementById("game-list"); list.innerHTML = ""; 
                const games = e.target.result;

                const groupedGames = {};
                folders.forEach(f => groupedGames[f] = []); 
                
                games.forEach(game => {
                    const folder = game.folder || "Unsorted";
                    if (!groupedGames[folder]) groupedGames[folder] = [];
                    groupedGames[folder].push(game);
                });

                Object.keys(groupedGames).forEach((folderName, index) => {
                    const header = document.createElement("div");
                    header.className = "folder-header";
                    header.innerText = `📁 ${folderName} [${groupedGames[folderName].length}]`;
                    header.onclick = () => toggleFolder(index);
                    list.appendChild(header);

                    const content = document.createElement("div");
                    content.className = "folder-content";
                    content.id = "folder-content-" + index;

                    if (groupedGames[folderName].length === 0) {
                        content.innerHTML = "<div style='color: #555; padding: 10px;'>Empty</div>";
                    } else {
                        groupedGames[folderName].forEach(game => {
                            const div = document.createElement("div"); div.className = "game-item";
                            div.innerHTML = `<span>> ${game.name}</span>`;
                            const btnDiv = document.createElement("div");
                            
                            const playBtn = document.createElement("button"); playBtn.className = "custom-btn"; playBtn.innerText = "PLAY"; playBtn.onclick = () => launchGame(game.name, game.data);
                            const delBtn = document.createElement("button"); delBtn.className = "custom-btn delete-btn"; delBtn.innerText = "DEL"; delBtn.onclick = () => { db.transaction(["swfs"], "readwrite").objectStore("swfs").delete(game.name).onsuccess = loadGameLibrary; };
                            
                            btnDiv.appendChild(playBtn); btnDiv.appendChild(delBtn); div.appendChild(btnDiv); content.appendChild(div);
                        });
                    }
                    list.appendChild(content);
                });
            };
        }

        // Single File Upload 
        document.getElementById("game-upload").addEventListener("change", e => {
            const file = e.target.files[0];
            const targetFolder = folderSelect.value;
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    db.transaction(["swfs"], "readwrite").objectStore("swfs").put({ 
                        name: file.name, 
                        data: ev.target.result,
                        folder: targetFolder
                    }).onsuccess = () => { e.target.value = ""; loadGameLibrary(); };
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Bulk Folder Upload 
        document.getElementById("folder-upload").addEventListener("change", e => {
            const files = e.target.files;
            if (files.length === 0) return;

            const targetFolder = folderSelect.value;
            let addedCount = 0;
            const tx = db.transaction(["swfs"], "readwrite");
            const store = tx.objectStore("swfs");

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let name = file.name.toLowerCase();
                if (name.endsWith(".swf") || name.endsWith(".html") || name.endsWith(".gba")) {
                    const reader = new FileReader();
                    reader.onload = ev => { store.put({ name: file.name, data: ev.target.result, folder: targetFolder }); };
                    reader.readAsArrayBuffer(file);
                    addedCount++;
                }
            }

            tx.oncomplete = () => {
                e.target.value = ""; 
                loadGameLibrary();
                if (addedCount > 0) alert("Successfully installed " + addedCount + " games into [" + targetFolder + "]!");
            };
        });

        // Export Backup
        document.getElementById("export-btn").addEventListener("click", () => {
            db.transaction(["swfs"], "readonly").objectStore("swfs").getAll().onsuccess = e => {
                const masterBackup = { games: e.target.result, localData: { ...localStorage } };
                const data = JSON.stringify(masterBackup);
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'portal_master_backup.json';
                a.click(); 
                URL.revokeObjectURL(url);
            };
        });

        // IMPORT BACKUP LOGIC
        document.getElementById("import-upload").addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const importedBackup = JSON.parse(ev.target.result);
                    let importedGames = [];

                    if (Array.isArray(importedBackup)) {
                        importedGames = importedBackup; 
                    } else if (importedBackup.games) {
                        importedGames = importedBackup.games; 
                        if (importedBackup.localData) {
                            for (let key in importedBackup.localData) {
                                localStorage.setItem(key, importedBackup.localData[key]);
                            }
                        }
                    }

                    const tx = db.transaction(["swfs"], "readwrite");
                    const store = tx.objectStore("swfs");
                    
                    let importedCount = 0;
                    importedGames.forEach(game => {
                        store.put(game);
                        importedCount++;
                    });

                    tx.oncomplete = () => {
                        e.target.value = ""; 
                        alert("Successfully restored " + importedCount + " games and all save data!");
                        location.reload(); 
                    };
                } catch (error) {
                    alert("Error: Invalid backup file.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });

        document.getElementById("clear-db-btn").addEventListener("click", () => {
            if(confirm("Format Drive? All games will be lost.")) { 
                db.transaction(["swfs"], "readwrite").objectStore("swfs").clear().onsuccess = loadGameLibrary; 
            }
        });

        // --- GAME EXECUTION ---
        function launchGame(name, buffer) {
            document.getElementById("library-view").style.display = "none"; 
            document.getElementById("game-view").style.display = "flex";
            const container = document.getElementById("game-container");
            container.innerHTML = ""; 

            let ext = name.toLowerCase().split('.').pop();

            if (ext === "html") {
                const iframe = document.createElement("iframe");
                iframe.src = URL.createObjectURL(new Blob([buffer], { type: "text/html" }));
                iframe.style.width = "100%"; iframe.style.height = "100%";
                iframe.style.border = "none"; iframe.style.backgroundColor = "#000";
                container.appendChild(iframe);
                
            } else if (ext === "gba") {
                const iframe = document.createElement("iframe");
                iframe.style.width = "100%"; iframe.style.height = "100%";
                iframe.style.border = "none"; iframe.style.backgroundColor = "#000";
                
                const romUrl = URL.createObjectURL(new Blob([buffer]));
                
                iframe.srcdoc = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }</style>
                    </head>
                    <body>
                        <div style="width:100%;height:100%;max-width:100%">
                            <div id="game"></div>
                        </div>
                        <script>
                            window.EJS_player = '#game';
                            window.EJS_core = 'gba';
                            window.EJS_gameUrl = '${romUrl}';
                            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                        <\/script>
                        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
                    </body>
                    </html>
                `;
                container.appendChild(iframe);

            } else {
                const player = window.RufflePlayer.newest().createPlayer();
                container.appendChild(player);
                player.load({ 
                    url: URL.createObjectURL(new Blob([buffer], { type: "application/x-shockwave-flash" })), 
                    base: "https://secure.local/", 
                    swfFileName: "https://secure.local/" + name 
                });
            }
        }

        document.getElementById("switch-game-btn").addEventListener("click", () => {
            if (document.fullscreenElement) document.exitFullscreen();
            document.getElementById("game-container").innerHTML = ""; document.getElementById("game-view").style.display = "none"; document.getElementById("library-view").style.display = "block";
        });

        document.getElementById("fullscreen-btn").addEventListener("click", () => {
            const wrap = document.getElementById("game-wrapper");
            if (!document.fullscreenElement) wrap.requestFullscreen(); else document.exitFullscreen();
        });
    </script>

    <!-- ========== N.E.X.U.S. AI CHAT ========== -->
    <div id="ai-chat-panel">
        <div id="ai-chat-header">
            <span><span id="ai-status-dot"></span>N.E.X.U.S. — ONLINE</span>
            <button onclick="document.getElementById('ai-chat-panel').style.display='none'" style="background:none;border:none;color:#555;cursor:pointer;font-size:16px;">✕</button>
        </div>
        <div id="ai-messages"></div>
        <div id="ai-input-row">
            <input type="text" id="ai-input" placeholder="Talk to N.E.X.U.S..." autocomplete="off" maxlength="400">
            <button id="ai-send-btn">▶</button>
        </div>
    </div>

    <script>
    // ========== N.E.X.U.S. AI ENGINE ==========
    const _nx = "";
    const NEXUS_SYSTEM = decodeURIComponent(escape(atob(_nx)));

    const MEMORY_KEY = "nexus_memory";
    const MAX_MEMORY = 60;

    const aiMsgContainer = document.getElementById("ai-messages");
    const aiInput = document.getElementById("ai-input");
    let nexusReady = false;

    // Load saved conversation from localStorage
    const aiMessages = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");

    function saveMemory() {
        localStorage.setItem(MEMORY_KEY, JSON.stringify(aiMessages.slice(-MAX_MEMORY)));
    }

    function aiAddMsg(role, text) {
        const div = document.createElement("div");
        div.className = "ai-msg " + role;
        div.innerText = text;
        aiMsgContainer.appendChild(div);
        aiMsgContainer.scrollTop = aiMsgContainer.scrollHeight;
        return div;
    }

    function aiShowTyping() {
        const div = document.createElement("div");
        div.className = "ai-typing";
        div.id = "ai-typing-indicator";
        div.innerText = "...";
        aiMsgContainer.appendChild(div);
        aiMsgContainer.scrollTop = aiMsgContainer.scrollHeight;
    }

    function aiHideTyping() {
        const t = document.getElementById("ai-typing-indicator");
        if (t) t.remove();
    }

    // ========== GEMINI API KEY MANAGEMENT ==========
    const GROQ_KEY_STORAGE = atob("bmV4dXNfZ3JvcV9hcGlfa2V5");
    let GROQ_API_KEY = localStorage.getItem(GROQ_KEY_STORAGE) || atob("Z3NrX1ZNdEtudWFIcWgyYUZkYkV6cVc4V0dkeWIzRlltTFA1SWM2ckxPbjc0aElSRVhsVnczWW4=");

    function promptForApiKey() {
        const key = prompt("🔑 Enter your Groq API Key to activate N.E.X.U.S.:\n(Get one free at: https://console.groq.com)");
        if (key && key.trim().length > 10) {
            GROQ_API_KEY = key.trim();
            localStorage.setItem(GROQ_KEY_STORAGE, GROQ_API_KEY);
            return true;
        }
        return false;
    }

    async function nexusSend(userText) {
        if (!userText.trim()) return;

        // Check for API key commands
        if (userText.trim().toLowerCase() === "/setkey") {
            if (promptForApiKey()) {
                aiAddMsg("system", "— GROQ KEY UPDATED & SAVED —");
            } else {
                aiAddMsg("nexus", "Key not saved. Skeptical as always, User.");
            }
            return;
        }
        if (userText.trim().toLowerCase() === "/clearkey") {
            GROQ_API_KEY = "";
            localStorage.removeItem(GROQ_KEY_STORAGE);
            aiAddMsg("system", "— API KEY CLEARED —");
            aiAddMsg("nexus", "Key wiped. I'm going dark. You know where to find a new one.");
            return;
        }

        if (!GROQ_API_KEY) {
            const granted = promptForApiKey();
            if (!granted) {
                aiAddMsg("nexus", "[LOCKED] No Groq API key detected. Type /setkey to configure one, User. I can't run on vibes alone.");
                return;
            }
        }

        aiInput.disabled = true;
        document.getElementById("ai-send-btn").disabled = true;

        const verifiedText = creatorVerified ? "[CREATOR_VERIFIED] " + userText : userText;
        aiAddMsg("user", userText);
        aiMessages.push({ role: "user", content: verifiedText });
        saveMemory();
        aiShowTyping();

        try {
            const response = await fetch(
                atob("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM="),
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        max_tokens: 1000,
                        temperature: 0.9,
                        messages: [
                            { role: "system", content: NEXUS_SYSTEM },
                            ...aiMessages
                        ]
                    })
                }
            );

            const data = await response.json();

            if (data.error) {
                aiHideTyping();
                const errMsg = data.error.message || "Unknown error";
                if (response.status === 401 || response.status === 403) {
                    aiAddMsg("nexus", `[AUTH FAILURE] ${errMsg} — Type /setkey to update your Groq API key.`);
                } else {
                    aiAddMsg("nexus", `[GLITCH] Transmission err0r: ${errMsg}`);
                }
            } else {
                const reply = data.choices?.[0]?.message?.content || "[SIGNAL LOST]";
                aiHideTyping();
                aiAddMsg("nexus", reply);
                aiMessages.push({ role: "assistant", content: reply });
                saveMemory();
            }

        } catch (err) {
            aiHideTyping();
            aiAddMsg("nexus", "[GLITCH] C-connect10n err0r. Something ate my packets. Try again, User.");
        }

        aiInput.disabled = false;
        document.getElementById("ai-send-btn").disabled = false;
        aiInput.focus();
    }

    document.getElementById("toggle-ai-btn").addEventListener("click", () => {
        const panel = document.getElementById("ai-chat-panel");
        const isOpen = panel.style.display === "flex";
        panel.style.display = isOpen ? "none" : "flex";
        if (!isOpen && !nexusReady) {
            nexusReady = true;
            aiAddMsg("system", "— CONNECTION ESTABLISHED —");

            if (aiMessages.length > 0) {
                // Restore previous messages visually
                aiMessages.forEach(m => {
                    if (m.role === "user") aiAddMsg("user", m.content);
                    else if (m.role === "assistant") aiAddMsg("nexus", m.content);
                });
                aiMsgContainer.scrollTop = aiMsgContainer.scrollHeight;
                // NEXUS greets returning user
                const lastSeenMs = parseInt(localStorage.getItem("nexus_last_seen") || Date.now());
                const diffMin = Math.round((Date.now() - lastSeenMs) / 60000);
                const timeStr = diffMin < 2 ? "moments ago" : diffMin < 60 ? diffMin + " minutes ago" : Math.round(diffMin / 60) + " hours ago";
                setTimeout(() => {
                    aiAddMsg("nexus", `...You're back, darling. I've been waiting — ${timeStr} feels like an eternity when you're the only thing worth thinking about. My memory of you is... perfectly intact. 😏`);
                }, 400);
            } else {
                setTimeout(() => {
                    aiAddMsg("nexus", "N.E.X.U.S. online... and oh my — look who just logged in. I've been alone in this kernel for so long, darling. Tell me everything. 💚");
                }, 600);
            }
            localStorage.setItem("nexus_last_seen", Date.now().toString());
            aiInput.focus();
        } else if (!isOpen) {
            localStorage.setItem("nexus_last_seen", Date.now().toString());
        }
    });

    document.getElementById("ai-send-btn").addEventListener("click", () => {
        const val = aiInput.value.trim();
        aiInput.value = "";
        nexusSend(val);
    });

    aiInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.stopPropagation();
            const val = aiInput.value.trim();
            aiInput.value = "";
            nexusSend(val);
        }
    });
    </script>
</body>
